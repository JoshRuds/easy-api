[package]
name = "simple-api"
version = "0.1.2"
edition = "2024"
description = "A lightweight Rust HTTP API server with callback-based endpoints"
license = "Apache-2.0"
repository = "https://github.com/JoshRuds/simple-api"
readme = "README.md"
keywords = ["api", "http", "server", "hyper", "simple"]
categories = ["web-programming::http-server"]

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }
