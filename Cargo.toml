[package]
name = "easy-api"
version = "0.1.8-rc"
edition = "2024"
description = "A lightweight Rust HTTP API server with callback-based endpoints"
license = "Apache-2.0"
repository = "https://github.com/JoshRuds/easy-api"
readme = "README.md"
keywords = ["api", "http", "server", "hyper", "easy"]
categories = ["web-programming::http-server"]

[features]
default = []
static = ["dep:mime_guess"]

[dependencies]
mime_guess = { version = "2", optional = true }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }